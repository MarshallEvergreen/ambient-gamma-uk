name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv run poe sync

      - name: Check formatting
        run: uv run poe ci:fmt

      - name: Lint
        run: uv run poe ci:lint

      - name: Type Check
        run: uv run poe check

      - name: Test
        run: uv run poe test
