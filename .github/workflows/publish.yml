name: Publish Dataset

on:
  schedule:
    - cron: "0 9 15 * *"  # 09:00 UTC on the 15th of every month
  workflow_dispatch:       # allow manual runs

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv run poe sync

      - name: Build dataset
        run: uv run python scripts/publish-dataset.py ambient-gamma-radiation-dose-rates-across-the-uk.parquet

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(date -u +"%Y-%m")
          gh release create "$TAG" ambient-gamma-radiation-dose-rates-across-the-uk.parquet --clobber \
            --title "Dataset $TAG" \
            --notes "Monthly dataset build. One row per monitoring station per quarter, covering 2010 to present."
