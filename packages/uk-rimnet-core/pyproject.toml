[build-system]
requires = ["uv_build>=0.5.21,<0.12"]
build-backend = "uv_build"

[project]
name = "uk-rimnet-core"
version = "0.1.0"
description = "Core library for uk-rimnet"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastexcel>=0.20.2",
    "fsspec>=2026.4.0",
    "httpx>=0.28.1",
    "polars>=1.41.2",
    "pydantic>=2.13.4",
    "rich>=13.0.0",
]
