[tool.poe.tasks]
# run with eg `uv run poe fmt`
fmt = "ruff format ${PWD}"
lint = "ruff check --fix ${PWD}"
check = "ty check ${PWD}"
test = "pytest ${PWD}"
# run all the above
all = [{ ref = "fmt" }, { ref = "lint" }, { ref = "check" }, { ref = "test" }]

echo = "echo ${PWD}"

"ci:fmt" = "ruff format --check ${PWD}"        # fail if not formatted
"ci:lint" = "ruff check ${PWD}"
"sync" = "uv sync --all-packages --all-groups"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "matplotlib>=3.10.9",
    "geopandas>=1.1.3",
    "loguru>=0.7.3",
    "marimo>=0.23.8",
    "poethepoet>=0.46.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "ty>=0.0.40",
]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["ALL"]
"**/tests/**" = [
    "D102",    # missing docstring in public method
    "S101",    # use of assert
    "PLR2004", # magic value in comparison
]
